  <path d="M7 25 C 13 24, 19 19.5, 25 8 L 25 25 Z" fill="#ffffff" opacity="0.28"/>
  <path d="M7 25 C 13 24, 19 19.5, 25 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
