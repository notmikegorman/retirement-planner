<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Retirement Planner favicon: rounded square + upward compounding curve with
       a fan band beneath it. Solid mid-blue background keeps it legible on
       both light and dark browser tabs at 16px. -->
