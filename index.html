<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retirement Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The PWA manifest (Phase 7): its own URLs (icons, start_url, scope)
         are relative to the manifest file, so it is base-agnostic; this
         link's absolute href is base-prefixed by Vite at build time, like
         the favicon's. Installing is what upgrades the picked-folder
         permission to auto-persist on Chromium. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <script>
      // Stamp the resolved theme on <html> BEFORE first paint so there is no
      // flash of the wrong theme. src/ui/theme.ts keeps data-theme in sync
      // afterwards (same storage key + resolution rules).
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('fplan-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          /* storage/matchMedia unavailable -> default light */
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
    <script>
      // If the app's code never runs at all (a cached copy pointing at files
      // that no longer exist, a browser that cannot load it), the page would
      // stay blank for ever. main.tsx sets __fplanBooting the moment it runs;
      // without it after 10 s, say so in plain HTML — no bundle needed.
      setTimeout(function () {
        if (window.__fplanBooting) return;
        var root = document.getElementById('root');
        if (!root || root.childNodes.length > 0) return;
        root.innerHTML =
          '<div style="max-width:44rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif">' +
          '<h1>The planner’s code did not start</h1>' +
          '<p>This browser loaded the page but not the app. Usually a stale cached copy is to blame.</p>' +
          '<p><button id="fplan-reset">Clear the app cache and reload</button></p>' +
          '<pre style="white-space:pre-wrap;font-size:12px"></pre></div>';
        root.querySelector('pre').textContent =
          'browser: ' + navigator.userAgent + '\nservice worker: ' +
          (navigator.serviceWorker && navigator.serviceWorker.controller ? 'controlling this page' : 'none');
        console.error('[fplan boot] the app bundle never started');
        document.getElementById('fplan-reset').onclick = function () {
          var done = function () { location.reload(); };
          var sw = navigator.serviceWorker;
          Promise.resolve(sw ? sw.getRegistrations() : [])
            .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
            .then(function () { return window.caches ? caches.keys() : []; })
            .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
            .then(done, done);
        };
      }, 10000);
    </script>
  </body>
</html>
